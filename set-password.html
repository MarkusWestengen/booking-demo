<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b1a2b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'self' https://*.supabase.co wss://*.supabase.co;
  frame-ancestors 'none';
  base-uri 'self';
  form-action 'self';
">

<title>Sett passord · Westengen Klinikk</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1a2b'/%3E%3Ctext x='16' y='20' font-family='Georgia,serif' font-size='15' font-weight='500' text-anchor='middle' fill='%23ebf2fa'%3EWK%3C/text%3E%3Crect x='7' y='24' width='18' height='2' fill='%23427aa1'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --green: #064789;
    --green-deep: #04315b;
    --green-soft: #8fc1e0;
    --paper: #ebf2fa;
    --paper-2: #dde8f3;
    --ink: #0b1a2b;
    --ink-2: #26384b;
    --muted: #4a5c6f;
    --rule: rgba(11,26,43,.16);
    --danger: #a4262c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', Helvetica, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  .bg-pattern {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 20% 10%, rgba(6, 71, 137, 0.06), transparent 60%),
      radial-gradient(circle at 80% 90%, rgba(4, 49, 91, 0.05), transparent 50%);
  }

  .shell {
    position: relative; z-index: 1;
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }

  .card {
    width: 100%; max-width: 480px;
    background: #fff;
    border: 1px solid var(--rule);
    padding: 40px 36px;
  }

  .wordmark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--green); font-weight: 500;
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 400;
    font-size: 26px; letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  .lede { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 24px; }

  .err {
    background: #fbebeb; border-left: 3px solid var(--danger);
    padding: 10px 14px; font-size: 13px; color: #7a1912; margin-bottom: 16px;
    display: none;
  }
  .err.shown { display: block; }

  .ok {
    background: #e9f3ec; border-left: 3px solid var(--green);
    padding: 10px 14px; font-size: 13px; color: var(--green-deep); margin-bottom: 16px;
    display: none;
  }
  .ok.shown { display: block; }

  form label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 6px;
  }
  form input {
    width: 100%;
    font-family: inherit; font-size: 15px;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    background: var(--paper);
    margin-bottom: 18px;
  }
  form input:focus { outline: 2px solid var(--green); outline-offset: -2px; }
  form input:disabled { background: #f3f1ec; color: var(--muted); cursor: not-allowed; }

  .btn-primary {
    width: 100%;
    background: var(--green); color: #fff; border: 0;
    padding: 14px 20px; font-family: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; letter-spacing: 0.02em;
  }
  .btn-primary:hover { background: var(--green-deep); }
  .btn-primary[disabled] { opacity: 0.6; cursor: not-allowed; }

  footer {
    position: relative; z-index: 1;
    text-align: center; padding: 18px 20px 26px;
    font-size: 12px; color: var(--muted);
  }

  @media (max-width: 480px) {
    .card { padding: 32px 22px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="bg-pattern" aria-hidden="true"></div>

<div class="shell">
  <div class="card">
    <div class="wordmark">Westengen Klinikk</div>
    <h1>Sett ditt passord</h1>
    <p class="lede" id="lede">Velkommen til Westengen Klinikk. Velg et passord for kontoen din.</p>

    <div class="err" id="err" role="alert"></div>
    <div class="ok" id="ok" role="status"></div>

    <form id="pwForm" novalidate>
      <label for="pw1">Nytt passord</label>
      <input id="pw1" name="pw1" type="password"
             placeholder="Skriv inn et nytt passord, minst 8 tegn"
             autocomplete="new-password" minlength="8" required>

      <label for="pw2">Bekreft passord</label>
      <input id="pw2" name="pw2" type="password"
             placeholder="Skriv passordet en gang til"
             autocomplete="new-password" minlength="8" required>

      <button class="btn-primary" type="submit" id="pwSubmit">Sett passord og logg inn</button>
    </form>
  </div>
</div>

<footer>
  Tilgang kun for ansatte ved Westengen Klinikk. Kontakt Markus for hjelp.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/booking-config.js"></script>
<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }

  function showError(msg) {
    var e = $('err'); e.textContent = msg; e.classList.add('shown');
    $('ok').classList.remove('shown');
  }
  function showOk(msg) {
    var e = $('ok'); e.textContent = msg; e.classList.add('shown');
    $('err').classList.remove('shown');
  }
  function clearMessages() {
    $('err').classList.remove('shown');
    $('ok').classList.remove('shown');
  }
  function disableForm() {
    $('pw1').disabled = true;
    $('pw2').disabled = true;
    $('pwSubmit').disabled = true;
  }

  // Vanlige Supabase Auth-feilmeldinger oversatt til norsk. Ukjente
  // meldinger sendes gjennom som-er (engelsk) — bedre enn å skjule info.
  function translateAuthError(msg) {
    if (!msg) return 'Ukjent feil. Prøv igjen, eller be om en ny lenke.';
    var lower = msg.toLowerCase();
    if (lower.indexOf('different from the old password') !== -1) {
      return 'Det nye passordet må være forskjellig fra det forrige.';
    }
    if (lower.indexOf('password should be at least') !== -1) {
      return 'Passordet er for kort. Bruk minst 8 tegn.';
    }
    if (lower.indexOf('weak') !== -1 && lower.indexOf('password') !== -1) {
      return 'Passordet er for svakt. Bruk et lengre eller mer variert passord.';
    }
    if (lower.indexOf('session') !== -1 && lower.indexOf('missing') !== -1) {
      return 'Innloggings-sesjonen mangler. Lenken kan være utløpt. Be om en ny.';
    }
    if (lower.indexOf('rate limit') !== -1 || lower.indexOf('too many') !== -1) {
      return 'For mange forsøk. Vent et øyeblikk og prøv igjen.';
    }
    // Alt annet er systemets egne ord, på engelsk. De hører hjemme i
    // konsollen, ikke på skjermen til den som prøver å sette et passord.
    console.error('Uoversatt feil fra Auth:', msg);
    return 'Det gikk ikke. Prøv igjen, eller be om en ny lenke.';
  }

  // ---------- Supabase client ----------
  var CFG = window.WestengenKlinikkBackend || {};
  // Uten nokler ville createClient('') kastet, og sida ville sett ut
  // som om den hang. Vi sier heller tydelig fra hva som mangler.
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) {
    var _cfgTarget = document.getElementById('bootView') || document.body;
    _cfgTarget.innerHTML =
      '<div class="auth-wrap"><div class="login"><h1>Konfigurasjon mangler</h1>' +
      '<p>Denne kopien er ikke koblet til en database ennå. Fyll inn Supabase-URL ' +
      'og anon-nøkkel i <code>shared/booking-config.js</code>, se ' +
      '<code>DEMO_SETUP.md</code>.</p></div></div>';
    return;
  }
  if (!window.supabase || !window.supabase.createClient) {
    showError('Auth-modulen kunne ikke lastes. Sjekk nettverk og prøv igjen.');
    disableForm();
    return;
  }
  // detectSessionInUrl: false fordi vi parser hash manuelt og kaller
  // setSession() eksplisitt. Speiler ansatt.html-mønsteret.
  var sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
    auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
  });

  // ---------- Parse invite/recovery tokens fra URL-hash ----------
  // Supabase sender begge token-typer som hash-params: #access_token=…&
  // refresh_token=…&type=invite | recovery. Vi støtter begge slik at
  // samme side også fungerer for fremtidig glemt-passord-flow.
  var rawHash = (window.location.hash || '').replace(/^#/, '');
  var hash = new URLSearchParams(rawHash);
  var access_token  = hash.get('access_token');
  var refresh_token = hash.get('refresh_token');
  var type          = hash.get('type');
  var hashError     = hash.get('error_description') || hash.get('error');

  if (hashError) {
    showError('Lenken er ugyldig eller utløpt. Be om en ny invite.');
    disableForm();
    return;
  }
  if (!access_token || !refresh_token) {
    showError('Lenken mangler tilgangs-token. Lenken må åpnes direkte fra invite-e-posten. Kopier hele URL-en hvis du har åpnet den i en annen nettleser.');
    disableForm();
    return;
  }
  if (type && type !== 'invite' && type !== 'recovery') {
    showError('Ukjent lenke-type. Be om en ny invite eller passord-reset.');
    disableForm();
    return;
  }
  // Tilpass intro-tekst for recovery-flyt
  if (type === 'recovery') {
    $('lede').textContent = 'Velg et nytt passord for kontoen din.';
  }

  // Rens hash fra adresselinja så token ikke ligger i browser-history
  // eller blir bokmerket. Bruker replaceState — ingen page-reload.
  try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (_) {}

  // Etabler session fra token. Når setSession lykkes har sb-klienten
  // en autentisert kontekst og updateUser() vil bruke den.
  sb.auth.setSession({ access_token: access_token, refresh_token: refresh_token })
    .then(function (res) {
      if (res && res.error) {
        showError(translateAuthError(res.error.message));
        disableForm();
      }
      // Frigjør lokale referanser til token (defense-in-depth — de er
      // ikke i URL lenger og sb-klienten holder dem internt).
      access_token = null; refresh_token = null;
    })
    .catch(function () {
      showError('Kunne ikke etablere sesjon. Be om en ny invite-lenke.');
      disableForm();
      access_token = null; refresh_token = null;
    });

  // ---------- Submit-handler ----------
  $('pwForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearMessages();

    var p1 = $('pw1').value;
    var p2 = $('pw2').value;

    if (!p1 || p1.length < 8) {
      showError('Passordet må være minst 8 tegn.');
      $('pw1').focus();
      return;
    }
    if (p1 !== p2) {
      showError('Passordene er ikke like. Skriv begge på nytt.');
      $('pw2').value = '';
      $('pw2').focus();
      return;
    }

    var btn = $('pwSubmit');
    btn.disabled = true; btn.textContent = 'Lagrer…';

    sb.auth.updateUser({ password: p1 }).then(function (res) {
      if (res && res.error) {
        showError(translateAuthError(res.error.message));
        btn.disabled = false; btn.textContent = 'Sett passord og logg inn';
        return;
      }
      showOk('Passord satt. Sender deg videre…');
      // Tøm input-feltene før redirect — minimerer at passordet ligger
      // i form-state ved evt. back-knapp.
      $('pw1').value = ''; $('pw2').value = '';
      setTimeout(function () {
        window.location.replace('ansatt.html');
      }, 1500);
    }).catch(function (err) {
      showError(translateAuthError((err && err.message) || ''));
      btn.disabled = false; btn.textContent = 'Sett passord og logg inn';
    });
  });

  // Fokus på første felt så snart siden er klar (men ikke før setSession
  // har hatt sjansen til å detektere feil — denne timeren er kort men
  // gir browseren tid til å gjøre layout).
  setTimeout(function () {
    if (!$('pw1').disabled) $('pw1').focus();
  }, 100);

})();
</script>

<script src="shared/demo-mode.js" defer></script>
</body>
</html>
