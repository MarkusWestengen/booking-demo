<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b1a2b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Westengen Klinikk">

<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'self' https://*.supabase.co wss://*.supabase.co;
  frame-ancestors 'none';
  base-uri 'self';
  form-action 'self';
">

<title>Ansattportal · Westengen Klinikk</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --green: #064789;
    --green-deep: #04315b;
    --green-soft: #8fc1e0;
    --paper: #ebf2fa;
    --paper-2: #dde8f3;
    --ink: #0b1a2b;
    --ink-2: #26384b;
    --muted: #4a5c6f;
    --rule: rgba(11,26,43,.16);
    --danger: #a4262c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* Subtilt vertikalt mønster for å skille fra kunde-vendt design. */
  .bg-pattern {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 20% 10%, rgba(6, 71, 137, 0.06), transparent 60%),
      radial-gradient(circle at 80% 90%, rgba(4, 49, 91, 0.05), transparent 50%);
  }

  .shell {
    position: relative; z-index: 1;
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 32px 20px;
  }

  .card {
    width: 100%; max-width: 420px;
    background: #fff;
    border: 1px solid var(--rule);
    padding: 36px 32px;
  }

  .brand {
    font-family: 'Fraunces', serif; font-weight: 400;
    font-size: 28px; letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .brand em {
    font-style: italic; color: var(--green-soft);
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    margin-left: 6px;
  }

  h1 {
    font-family: 'Fraunces', serif; font-weight: 400;
    font-size: 22px; letter-spacing: -0.01em;
    margin: 20px 0 6px;
  }
  .lede { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

  .err {
    background: #fbebeb; border-left: 3px solid var(--danger);
    padding: 10px 14px; font-size: 13px; color: #7a1912; margin-bottom: 16px;
  }
  .err.shown { display: block; }
  .err { display: none; }

  .ok {
    background: #e9f3ec; border-left: 3px solid var(--green);
    padding: 10px 14px; font-size: 13px; color: var(--green-deep); margin-bottom: 16px;
  }
  .ok.shown { display: block; }
  .ok { display: none; }

  form label {
    display: block;
    /* Samme grunn som i de andre skjemaene: en feltetikett er
       lesetekst, ikke data. Mono med store bokstaver og bred
       sperring gjorde innloggingen tyngre a lese enn den trenger. */
    font-size: 13.5px; font-weight: 500; letter-spacing: 0;
    color: var(--ink-2);
    margin-bottom: 6px;
  }
  form input {
    width: 100%;
    font-family: inherit; font-size: 15px;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    background: var(--paper);
    margin-bottom: 16px;
  }
  form input:focus { outline: 2px solid var(--green); outline-offset: -2px; }

  .btn-primary {
    width: 100%;
    background: var(--green); color: #fff; border: 0;
    padding: 13px 20px; font-family: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; letter-spacing: 0.02em;
  }
  .btn-primary:hover { background: var(--green-deep); }
  .btn-primary[disabled] { opacity: 0.6; cursor: progress; }

  .ghost-link {
    display: inline-block; margin-top: 18px;
    font-size: 13px; color: var(--muted); text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .ghost-link:hover { color: var(--ink); border-bottom-color: var(--rule); }

  footer {
    position: relative; z-index: 1;
    text-align: center; padding: 18px 20px 26px;
    font-size: 12px; color: var(--muted);
  }

  .boot {
    text-align: center; padding: 40px 0;
  }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--rule); border-top-color: var(--green);
    animation: spin 0.8s linear infinite;
    display: inline-block; vertical-align: middle; margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .card { padding: 28px 22px; }
    h1 { font-size: 20px; }
    .brand { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="bg-pattern" aria-hidden="true"></div>

<div class="shell">
  <div class="card">

    <!-- Bootstrap-view: kjører mens vi sjekker session -->
    <div id="bootView" class="boot">
      <div class="spinner" aria-hidden="true"></div>
      <span>Sjekker innlogging…</span>
    </div>

    <!-- Redirect-view: vises hvis allerede innlogget -->
    <div id="redirectView" style="display:none;" class="boot">
      <div class="spinner" aria-hidden="true"></div>
      <span>Logger deg inn…</span>
    </div>

    <!-- Login-view: standard flyt -->
    <div id="loginView" style="display:none;">
      <div class="brand">Westengen Klinikk <em>ansattportal</em></div>
      <h1>Innlogging for ansatte</h1>
      <p class="lede">Tilgang til kalender, journal og admin-funksjoner.</p>

      <div class="err" id="loginErr" role="alert"></div>
      <div class="ok" id="loginOk" role="status"></div>

      <form id="loginForm" novalidate>
        <label for="email">E-post</label>
        <input id="email" name="email" type="email"
               autocomplete="username" required
               autocapitalize="none" autocorrect="off" spellcheck="false">
        <label for="password">Passord</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
        <button class="btn-primary" type="submit" id="loginSubmit">Logg inn →</button>
      </form>

      <a href="#" id="forgotLink" class="ghost-link">Glemt passord?</a>
    </div>

  </div>
</div>

<footer>
  Tilgang kun for ansatte ved Westengen Klinikk. Kontakt Markus for hjelp med innlogging.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/booking-config.js"></script>
<script src="shared/auth.js"></script>
<script>
// PWA: registrer service worker for offline-cache av app-skall.
// Vi cacher kun statiske assets — aldri pasientdata, jf. sw.js-merknad.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
<script>
(function () {
  'use strict';

  // ---------- Supabase client ----------
  var CFG = window.WestengenKlinikkBackend || {};
  if (!window.supabase || !window.supabase.createClient) {
    showError('Innloggingsmodulen kunne ikke lastes. Sjekk nettverk og prøv igjen.');
    return;
  }

  // Demo-oppsettet leveres med tom booking-config.js, slik at en kopi av
  // repoet aldri kan komme til å peke på en annen klinikks database.
  // Uten den sjekken her ville createClient('') kastet, boot-spinneren
  // stått for alltid, og siden sett ut som om den hang — verst mulig
  // førsteinntrykk på nettopp den siden demoen skal vise fram.
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) {
    document.getElementById('bootView').style.display = 'none';
    document.getElementById('loginView').style.display = '';
    showError('Denne kopien er ikke koblet til en database ennå. Fyll inn '
            + 'Supabase-URL og anon-nøkkel i shared/booking-config.js, '
            + 'se DEMO_SETUP.md for de fire stegene.');
    var f = document.getElementById('loginForm');
    if (f) { f.querySelectorAll('input, button').forEach(function (el) { el.disabled = true; }); }
    return;
  }
  var sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
    auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
  });

  function $(id) { return document.getElementById(id); }
  function show(viewId) {
    ['bootView', 'redirectView', 'loginView'].forEach(function (v) {
      $(v).style.display = v === viewId ? '' : 'none';
    });
  }
  function showError(msg) {
    var e = $('loginErr'); e.textContent = msg; e.classList.add('shown'); e.style.display = '';
    $('loginOk').classList.remove('shown'); $('loginOk').style.display = 'none';
  }
  function showOk(msg) {
    var e = $('loginOk'); e.textContent = msg; e.classList.add('shown'); e.style.display = '';
    $('loginErr').classList.remove('shown'); $('loginErr').style.display = 'none';
  }
  function clearMessages() {
    $('loginErr').style.display = 'none'; $('loginErr').classList.remove('shown');
    $('loginOk').style.display = 'none'; $('loginOk').classList.remove('shown');
  }

  // ---------- Rate limiting (klient-side; supplerer Supabase Auth) ----------
  // P2-14 fra audit 2026-05-15: klient-side rate-limit er SOFT — det er
  // per-fane/per-browser-profil og kan omgås av angriper med flere profiler
  // eller inkognito. Reell beskyttelse mot brute-force kommer fra Supabase
  // Auth sin server-side throttling (egen quota). Klient-state finnes for
  // å gi rask feedback til legit brukere som glemmer passord, ikke som
  // sikkerhetsbarriere.
  var RL_KEY = 'tas_login_rate';
  var MAX_ATTEMPTS = 5;
  var WINDOW_MS = 15 * 60 * 1000; // 15 min

  function readRateState() {
    try {
      var raw = localStorage.getItem(RL_KEY);
      if (!raw) return { attempts: [], lockUntil: 0 };
      return JSON.parse(raw);
    } catch (_) { return { attempts: [], lockUntil: 0 }; }
  }
  function writeRateState(state) {
    try { localStorage.setItem(RL_KEY, JSON.stringify(state)); } catch (_) {}
  }
  function clearRateState() {
    try { localStorage.removeItem(RL_KEY); } catch (_) {}
  }
  function checkRateLimit() {
    var state = readRateState();
    var now = Date.now();
    if (state.lockUntil && state.lockUntil > now) {
      var minLeft = Math.ceil((state.lockUntil - now) / 60000);
      return { blocked: true, message: 'For mange mislykkede forsøk. Prøv igjen om ' + minLeft + ' min.' };
    }
    // Beskjær gamle forsøk
    state.attempts = (state.attempts || []).filter(function (t) { return now - t < WINDOW_MS; });
    writeRateState(state);
    return { blocked: false };
  }
  function registerFailedAttempt() {
    var state = readRateState();
    var now = Date.now();
    state.attempts = (state.attempts || []).filter(function (t) { return now - t < WINDOW_MS; });
    state.attempts.push(now);
    if (state.attempts.length >= MAX_ATTEMPTS) {
      state.lockUntil = now + WINDOW_MS;
    }
    writeRateState(state);
  }

  // ---------- Audit-logging av login-forsøk ----------
  // Vi har ingen autentisert bruker ennå ved mislykket forsøk, så vi går utenom
  // auth.js sin auditLog (som krever user) og inserter direkte med anon-klient.
  // RLS for audit_log INSERT krever actor_staff_id matcher JWT — for anon vil
  // RLS avvise. Det er OK: failed-login-logging er "best effort". Hvis RLS er
  // åpnet for anon-insert, går det inn; ellers ikke. Vi swallower feilen.
  function logLoginFailed(email, reason) {
    sb.from('audit_log').insert({
      actor_staff_id: 'unknown',
      actor_staff_name: 'Anonym pre-auth',
      action: 'login_failed',
      target_type: 'session',
      target_id: null,
      metadata: { attempted_email: email, reason: reason || null }
    }).then(function () {}, function () { /* swallow */ });
  }
  function logLoginSuccess(user) {
    // Etter session er etablert kan vi bruke standard auditLog som plukker
    // staff_id fra app_metadata. Trygt: kan ikke lekke pasientdata.
    if (window.WestengenKlinikkAuth && window.WestengenKlinikkAuth.auditLog) {
      window.WestengenKlinikkAuth.auditLog(sb, user, {
        action: 'login_success',
        target_type: 'session',
        target_id: null
      });
    }
  }

  // ---------- Session-sjekk ved page load ----------
  function routeAfterSession(session) {
    if (session && session.user) {
      show('redirectView');
      // Liten delay så bruker rekker å se "Logger deg inn…"
      setTimeout(function () {
        window.location.replace('kalender.html');
      }, 250);
    } else {
      show('loginView');
      // Forhåndsutfyll e-post-feltet hvis det er lagret som "remember"
      try {
        var remembered = localStorage.getItem('tas_last_email');
        if (remembered) $('email').value = remembered;
      } catch (_) {}
      setTimeout(function () { $('email').focus(); }, 50);
    }
  }

  // ----- Auto-innlogging -------------------------------------
  // requireAuth() sender hit med ?auto=admin&next=<side> naar en
  // adminside besokes uten sesjon. Uten parameteren oppfoerer sida
  // seg som foer: et vanlig innloggingsskjema.
  var _params = new URLSearchParams(window.location.search);
  var _auto = _params.get('auto');
  var _next = _params.get('next') || 'kalender.html';
  if (_auto === 'admin' || _auto === 'therapist') {
    show('bootView');
    var _acct = (window.WestengenKlinikkAuth && window.WestengenKlinikkAuth.demoAccount(_auto))
      || { email: 'admin@westengenklinikk.example', password: 'demo-admin-2026' };
    sb.auth.signOut().catch(function () {}).then(function () {
      return sb.auth.signInWithPassword({ email: _acct.email, password: _acct.password });
    }).then(function (res) {
      if (res && res.error) throw res.error;
      window.location.replace(_next);
    }).catch(function () {
      // Faller tilbake til skjemaet hvis auto-innloggingen ikke gaar
      // gjennom — da er som regel databasen ikke satt opp enda.
      show('loginView');
      showError('Kunne ikke logge inn automatisk. Sjekk at migrasjon 0065 er kjørt, '
              + 'eller logg inn manuelt under.');
    });
    return;
  }

  sb.auth.getSession().then(function (res) {
    routeAfterSession(res && res.data && res.data.session);
  }).catch(function () {
    show('loginView');
  });

  // ---------- Login-handler ----------
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearMessages();

    var email = $('email').value.trim().toLowerCase();
    var password = $('password').value;
    if (!email || !password) {
      showError('Fyll inn både e-post og passord.');
      return;
    }

    var rl = checkRateLimit();
    if (rl.blocked) {
      showError(rl.message);
      return;
    }

    var btn = $('loginSubmit');
    btn.disabled = true; btn.textContent = 'Logger inn…';

    sb.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
      if (res.error) {
        registerFailedAttempt();
        logLoginFailed(email, res.error.message || 'invalid_credentials');
        showError(res.error.message || 'Feil e-post eller passord.');
        btn.disabled = false; btn.textContent = 'Logg inn →';
        return;
      }
      // Suksess — null rate-limit, husk e-post, logg, redirect
      clearRateState();
      try { localStorage.setItem('tas_last_email', email); } catch (_) {}

      var user = res.data && res.data.user;
      var meta = (user && user.app_metadata) || {};
      logLoginSuccess({
        staffId: meta.staff_id || (meta.role === 'admin' ? 'admin' : 'unknown'),
        staffName: meta.staff_name || (meta.role === 'admin' ? 'Admin' : (user && user.email) || 'Ukjent'),
        role: meta.role,
        email: user && user.email
      });

      show('redirectView');
      setTimeout(function () { window.location.replace('kalender.html'); }, 250);
    }).catch(function (err) {
      registerFailedAttempt();
      logLoginFailed(email, (err && err.message) || 'network_error');
      showError((err && err.message) || 'Innlogging feilet. Prøv igjen.');
      btn.disabled = false; btn.textContent = 'Logg inn →';
    });
  });

  // ---------- Glemt passord ----------
  $('forgotLink').addEventListener('click', function (e) {
    e.preventDefault();
    clearMessages();
    var email = $('email').value.trim().toLowerCase();
    if (!email) {
      showError('Skriv inn e-posten din i feltet over først.');
      $('email').focus();
      return;
    }
    var link = this;
    link.textContent = 'Sender…';
    sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/set-password.html'
    }).then(function (res) {
      link.textContent = 'Glemt passord?';
      if (res.error) {
        showError('Kunne ikke sende reset-lenke: ' + res.error.message);
        return;
      }
      showOk('Reset-lenke sendt til ' + email + '. Sjekk innboksen (og spam).');
    }).catch(function (err) {
      link.textContent = 'Glemt passord?';
      showError('Kunne ikke sende reset-lenke: ' + ((err && err.message) || err));
    });
  });

})();
</script>

<script src="shared/demo-mode.js" defer></script>
</body>
</html>
